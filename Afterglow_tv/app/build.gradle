plugins { id 'com.android.application' version '8.7.3' }

def guideAssets = layout.buildDirectory.dir('generated/phone-setup-assets')
def stagePhoneGuides = tasks.register('stagePhoneGuides', Sync) {
    from(rootProject.file('../Afterglow_pc/Afterglow/web/guides')) {
        include '*.mp4'
        into 'guides'
    }
    into guideAssets
}

android {
    namespace 'local.afterglow.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'local.afterglow.tv'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.assets.srcDir guideAssets
}

tasks.named('preBuild') { dependsOn stagePhoneGuides }
